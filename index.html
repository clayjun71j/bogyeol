function ensureWeightItems(){
  const s=state.settings || (state.settings=deepClone(DEFAULT_SETTINGS));
  if(!Array.isArray(s.weightItems)){
    s.weightItems=WEIGHT_DEFS.map(d=>({key:d.key,label:d.label,value:Number(s.w&&s.w[d.key]!==undefined?s.w[d.key]:DEFAULT_SETTINGS.w[d.key])}));
  } else {
    s.weightItems=s.weightItems.filter(x=>x&&WEIGHT_DEFS.some(d=>d.key===x.key)).map(x=>{
      const d=WEIGHT_DEFS.find(d=>d.key===x.key);
      return {key:d.key,label:x.label||d.label,value:Number(x.value??0)};
    });
  }
  s.w=s.w||{};
  s.weightItems.forEach(x=>s.w[x.key]=Number(x.value));
}
function weightValue(state,key){
  ensureWeightItems();
  const x=state.settings.weightItems.find(x=>x.key===key);
  return x ? Number(x.value)||0 : 0;
}

function groupOf(tt, grade){ return tt.group1Grades.indexOf(Number(grade))>=0 ? 1 : 2; }
function lunchBlockIdx(group){ return group===1 ? 4 : 5; }
function periodToBlockIdx(tt, grade, p){
  p = Number(p);
  if (p>=1 && p<=4) return p-1;
  if (p===5) return groupOf(tt, grade)===1 ? 5 : 4;
  if (p===6) return 6;
  return null;
}
function blockIdxToPeriod(tt, grade, bi){
  if (bi<=3) return bi+1;
  const g = groupOf(tt, grade);
  if (bi===4) return g===1 ? null : 5;
  if (bi===5) return g===1 ? 5 : null;
  if (bi===6) return 6;
  return null;
}
function blockLabel(tt, bi){ const b=tt.blocks[bi]; return b.start+"~"+b.end; }
function maxPeriodOf(tt, grade, day){ const arr = tt.maxPeriods[grade]; return arr ? arr[day] : 6; }

// ----- 파서 -----
function cellStr(v){ return (v===null||v===undefined) ? "" : String(v).trim(); }
function parseGradeList(txt){
  const gs = new Set();
  txt.split(/[,\s]+/).forEach(part=>{
    if(!part) return;
    const m = part.match(/^(\d)\s*[~\-]\s*(\d)$/);
    if(m){ for(let g=Number(m[1]); g<=Number(m[2]); g++) gs.add(g); }
    else if(/^\d$/.test(part)) gs.add(Number(part));
  });
  return Array.from(gs);
}
function parseJdSheet(rows){
  rows = rows.map(r=>r.map(cellStr));
  const teachers=[], lessons=[], warns=[];
  let i=0;
  while(i<rows.length){
    const row=rows[i];
    if(row.indexOf("요일")>=0){
      const title = i>0 ? rows[i-1] : [];
      const subjCell = title[0]||"";
      const nameCell = title.slice(1).find(c=>c) || "";
      let name = nameCell;
      const m = nameCell.match(/^(.*?)\(/);
      if(m && m[1].trim()){ const toks=m[1].trim().split(/\s+/); name = toks[toks.length-1]; }
      else { name = nameCell.split("/")[0].trim(); }
      const hm = nameCell.match(/\(([^)]*)\)/);
      const subjmap=[];
      const re=/([가-힣A-Za-z]+)\s*\(([^)]*)\)/g; let mm;
      while((mm=re.exec(subjCell))!==null){ subjmap.push({subject:mm[1], grades:parseGradeList(mm[2])}); }
      if(subjmap.length===0 && subjCell) subjmap.push({subject:subjCell, grades:[]});
      if(!name){ warns.push((i+1)+"행: 교사명을 찾지 못했습니다 ('"+subjCell+"')"); }
      const dayCols={};
      row.forEach((c,j)=>{ if(DAYS.indexOf(c)>=0) dayCols[j]=DAYS.indexOf(c); });
      teachers.push({name:name, label:subjCell, hours: hm?hm[1]:"", subjects:subjmap});
      let k=i+1;
      while(k<rows.length){
        const r=rows[k];
        if(r[0]==="교시"){ k++; continue; }
        if(/^\d$/.test(r[0]||"")){
          const p=Number(r[0]);
          Object.keys(dayCols).forEach(j=>{
            const v=r[Number(j)]||""; if(!v) return;
            v.split("/").forEach(tok=>{
              const cm=tok.trim().match(/^(\d)\s*-\s*(\d+)/);
              if(!cm){ warns.push(name+" "+DAYS[dayCols[j]]+p+"교시: '"+tok+"' 해석 불가"); return; }
              const g=Number(cm[1]), c=Number(cm[2]);
              const found = subjmap.find(s=>s.grades.indexOf(g)>=0);
              const subject = found ? found.subject : (subjmap[0]?subjmap[0].subject:subjCell);
              lessons.push({teacher:name, day:dayCols[j], period:p, grade:g, cls:c, subject:subject});
            });
          });
          k++;
        } else break;
      }
      i=k;
    } else i++;
  }
  return {teachers, lessons, warns};
}
function parseClsSheet(rows){
  rows = rows.map(r=>r.map(cellStr));
  const classes=[], notes={}, slots=[], names={};
  let i=0;
  while(i<rows.length){
    const row=rows[i];
    if(/^\d-\d+$/.test(row[0]||"")){
      const cname=row[0]; classes.push(cname); if(row[1] && !/학기/.test(row[1])) names[cname]=row[1];
      row.slice(1).forEach(c=>{
        const nm=c.match(/([가-힣]+)\s*(\d)학기\s*담임/);
        if(nm){ (notes[cname]=notes[cname]||[]).push({subject:nm[1], semester:Number(nm[2])}); }
      });
      let k=i+1, dayCols={};
      while(k<rows.length){
        const r=rows[k];
        if(r.indexOf("요일")>=0){ dayCols={}; r.forEach((c,j)=>{ if(DAYS.indexOf(c)>=0) dayCols[j]=DAYS.indexOf(c); }); k++; continue; }
        if(r[0]==="교시"){ k++; continue; }
        if(/^\d$/.test(r[0]||"")){
          const p=Number(r[0]);
          Object.keys(dayCols).forEach(j=>{ const v=r[Number(j)]||""; if(v) slots.push({cls:cname, day:dayCols[j], period:p, subject:v}); });
          k++;
        } else if(r.every(c=>!c)){ k++; }
        else break;
      }
      i=k;
    } else i++;
  }
  return {classes, notes, slots, names};
}
function crossCheck(jd, cl){
  const warns=[];
  const lk={}; jd.lessons.forEach(l=>{ lk[l.grade+"-"+l.cls+"|"+l.day+"|"+l.period]=l; });
  const sk={}; cl.slots.forEach(s=>{ sk[s.cls+"|"+s.day+"|"+s.period]=s; });
  Object.keys(sk).forEach(k=>{ if(!lk[k]){ const s=sk[k]; warns.push("담임 시트에만 있음: "+s.cls+" "+DAYS[s.day]+" "+s.period+"교시 "+s.subject+" (전담 시트에 해당 수업 없음)"); }});
  Object.keys(lk).forEach(k=>{ if(!sk[k]){ const l=lk[k]; warns.push("전담 시트에만 있음: "+l.grade+"-"+l.cls+" "+DAYS[l.day]+" "+l.period+"교시 "+l.subject+"("+l.teacher+") (담임 시트에 없음)"); }});
  const clsSet = new Set(cl.classes);
  const unknown = new Set();
  jd.lessons.forEach(l=>{ const c=l.grade+"-"+l.cls; if(cl.classes.length && !clsSet.has(c)) unknown.add(c+" ("+l.teacher+" "+DAYS[l.day]+" "+l.period+"교시)"); });
  unknown.forEach(u=>warns.push("담임 시트에 없는 학급: "+u+" — 오타 가능성"));
  return warns;
}
function detectSheets(wbSheets){
  let jd = wbSheets.find(s=>/전담/.test(s.name));
  let cl = wbSheets.find(s=>/(담임|학급)/.test(s.name) && s!==jd);
  if(!jd && wbSheets.length>=1) jd = wbSheets[0];
  if(!cl && wbSheets.length>=2) cl = wbSheets.find(s=>s!==jd);
  return {jd, cl};
}
function buildImport(jdRows, clRows){
  const jd = parseJdSheet(jdRows);
  const cl = clRows ? parseClsSheet(clRows) : {classes:[], notes:{}, slots:[]};
  let classes = cl.classes.slice();
  if(classes.length===0){
    const s=new Set(); jd.lessons.forEach(l=>s.add(l.grade+"-"+l.cls));
    classes = Array.from(s);
  }
  classes.sort((a,b)=>{ const [ag,ac]=a.split("-").map(Number), [bg,bc]=b.split("-").map(Number); return ag-bg || ac-bc; });
  const warns = jd.warns.concat(clRows ? crossCheck(jd, cl) : []);
  return {jdTeachers: jd.teachers, lessons: jd.lessons, classes, classNotes: cl.notes, classNames: cl.names||{}, warns};
}

// ----- 상태 계산 -----
function lessonActive(state, l){
  const notes = state.classNotes[l.grade+"-"+l.cls] || [];
  return !notes.some(n=> l.subject.indexOf(n.subject)===0 && n.semester===Number(state.semester));
}
function activeLessons(state){ return state.lessons.filter(l=>lessonActive(state,l)); }

function statusOf(state, t, day, bi){
  const tt = state.tt;
  const act = state._act || (state._act = activeLessons(state));
  if(t.role==="담임"){
    const g=Number(t.grade), c=Number(t.cls);
    if(bi===lunchBlockIdx(groupOf(tt,g))) return {code:"점심", detail:"급식지도"};
    const p=blockIdxToPeriod(tt, g, bi);
    if(p===null) return {code:"점심", detail:""};
    if(p>maxPeriodOf(tt,g,day)) return {code:"종료", detail:"일과 종료"};
    const l = act.find(x=>x.day===day && x.period===p && x.grade===g && x.cls===c);
    if(l) return {code:"공강", detail:l.subject+"("+l.teacher+") 전담수업", period:p};
    return {code:"수업", detail:g+"-"+c+" 담임수업", period:p};
  }
  if(t.lunchGroup && bi===lunchBlockIdx(Number(t.lunchGroup))) return {code:"점심", detail:"점심"};
  const mine = act.filter(x=>x.teacher===t.name && x.day===day && periodToBlockIdx(tt,x.grade,x.period)===bi);
  if(mine.length) return {code:"수업", detail: mine.map(x=>x.grade+"-"+x.cls).join("/")+" "+mine[0].subject};
  return {code:"공강", detail: t.role==="전담" ? "전담 공강" : (t.role==="관리자"?"관리자":"비담임")};
}

function findTeacherByClass(state, g, c){ return state.teachers.find(t=>t.role==="담임" && Number(t.grade)===Number(g) && Number(t.cls)===Number(c)); }

function countStats(state, teacherName, dateStr){
  const semStart = state.settings.semesterStart[state.semester] || "2000-01-01";
  const month = dateStr.slice(0,7);
  let sem=0, mon=0, last=null, dayCnt=0;
  state.history.forEach(h=>{
    if(h.subId!==teacherName || h.type==="교체") return;
    if(h.date>=semStart) sem++;
    if(h.date.slice(0,7)===month) mon++;
    if(h.date===dateStr) dayCnt++;
    if(!last || h.date>last) last=h.date;
  });
  const t = state.teachers.find(x=>x.id===teacherName);
  sem += (t && t.adjust) ? Number(t.adjust) : 0;
  return {sem, mon, last, dayCnt};
}

function rankCandidates(state, ctx){
  const w = state.settings.w, tt=state.tt;
  ensureWeightItems();
  const out=[];
  state.teachers.forEach(t=>{
    if(t.id===ctx.absent.id) return;
    if(t.excluded) return;
    if(t.role==="관리자" && !state.settings.allowAdmin) return;
    const st = statusOf(state, t, ctx.day, ctx.bi);
    if(st.code!=="공강" && st.code!=="종료") return;
    const stats = countStats(state, t.id, ctx.dateStr);
    const tent = ctx.tentative[t.id]||0;
    if(stats.dayCnt + tent >= state.settings.maxPerDay) return;
    let score=0; const reasons=[];
    const sameGrade = t.role==="담임" && Number(t.grade)===Number(ctx.grade);
    const isPm = ctx.period>=5;
    if(ctx.homeroomFirst && t.role==="담임" && Number(t.grade)===Number(ctx.grade) && Number(t.cls)===Number(ctx.cls)){
      score+=50; reasons.push("해당 학급 담임(규정 4-나-2)");
    }
    if(!isPm){
      if(t.role==="전담" && teachesGrade(state,t,ctx.grade)){ score+=weightValue(state,"amSameGradeJd"); reasons.push("동학년 전담"); }
      else if(sameGrade){ score+=weightValue(state,"amSameGradeHomeroom"); reasons.push("동학년 담임 공강"); }
      else if(t.role==="전담"){ score+=weightValue(state,"amOtherJd"); reasons.push("타학년 전담"); }
      else if(t.role==="담임"){ score+=weightValue(state,"amOtherHomeroom"); reasons.push(st.code==="종료"?"타학년 담임(일과 종료)":"타학년 담임 공강"); }
    } else {
      if(t.role==="담임" && st.code==="종료"){ score+=weightValue(state,"pmEnded"); reasons.push("수업 끝난 학년 담임(기준표 5-6교시)"); }
      else if(t.role==="전담"){ score+=weightValue(state,"pmJd"); reasons.push("전담 공강"); }
      else if(t.role==="담임"){ score+=weightValue(state,"pmHomeroomFree"); reasons.push("담임 공강"); }
      if(sameGrade){ score+=weightValue(state,"pmSameGradeBonus"); reasons.push("동학년"); }
    }
    if(t.role==="비담임"){ score+=weightValue(state,"nonHomeroom"); reasons.push("비담임"); }
    if(t.role==="관리자"){ score+=weightValue(state,"adminPenalty"); reasons.push("관리자(필요 시)"); }
    const fair = Math.max(-weightValue(state,"perCountCap"), weightValue(state,"perCount")*(stats.sem+tent));
    score+=fair; reasons.push("학기 누적 "+(stats.sem+tent)+"회");
    if((t.role==="전담"||t.role==="비담임") && stats.mon+tent>=weightValue(state,"overloadThreshold")){ score+=weightValue(state,"overloadPenalty"); reasons.push("이달 "+stats.mon+"회, 부담 과다(규정 3-나)"); }
    let adj=0;
    [ctx.bi-1, ctx.bi+1].forEach(b=>{ if(b>=0 && b<tt.blocks.length){ const s2=statusOf(state,t,ctx.day,b); if(s2.code==="수업") adj++; }});
    if(adj===2){ score+=weightValue(state,"adjacentBusyPenalty"); reasons.push("앞뒤 교시 연속 수업"); }
    out.push({teacher:t, score, reasons, status:st, stats});
  });
  out.sort((a,b)=> b.score-a.score || a.stats.sem-b.stats.sem || ((a.stats.last||"")<(b.stats.last||"") ? -1 : 1));
  return out;
}
function teachesGrade(state, t, grade){
  return state.lessons.some(l=>l.teacher===t.name && Number(l.grade)===Number(grade));
}

function swapSuggestions(state, absent, day, periods){
  const tt=state.tt, g=Number(absent.grade), c=Number(absent.cls);
  const maxP = maxPeriodOf(tt,g,day);
  const allDay = periods.length>=maxP;
  if(absent.role!=="담임" || allDay) return {};
  const act = activeLessons(state);
  const classLessons = act.filter(l=>l.day===day && l.grade===g && l.cls===c && periods.indexOf(l.period)<0);
  const res={};
  periods.forEach(p=>{
    const bi=periodToBlockIdx(tt,g,p);
    const hasJd = act.some(l=>l.day===day && l.period===p && l.grade===g && l.cls===c);
    if(hasJd) return;
    classLessons.forEach(l=>{
      const jt = state.teachers.find(t=>t.name===l.teacher);
      if(!jt || jt.excluded) return;
      const st = statusOf(state, jt, day, bi);
      if(st.code==="공강"){
        (res[p]=res[p]||[]).push({teacher:jt, fromPeriod:l.period, subject:l.subject});
      }
    });
  });
  return res;
}

function esc(s){ return String(s===undefined||s===null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(ds){ const d=new Date(ds+"T00:00:00"); const w=["일","월","화","수","목","금","토"][d.getDay()]; return (d.getMonth()+1)+"월 "+d.getDate()+"일("+w+")"; }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

function freshStateFromImport(imp, prev){
  const teachers=[];
  imp.classes.forEach(c=>{
    const [g,k]=c.split("-").map(Number);
    const id="hr:"+c;
    const old = prev ? prev.teachers.find(t=>t.id===id) : null;
    teachers.push({id, role:"담임", grade:g, cls:k, name: old?old.name:((imp.classNames&&imp.classNames[c])||""), excluded: old?!!old.excluded:false, memo: old?old.memo||"":"", adjust: old?old.adjust||0:0});
  });
  imp.jdTeachers.forEach(j=>{
    const id="jd:"+j.name;
    const old = prev ? prev.teachers.find(t=>t.id===id) : null;
    teachers.push({id, role:"전담", name:j.name, label:j.label, hours:j.hours, lunchGroup: old?old.lunchGroup:null, excluded: old?!!old.excluded:false, memo: old?old.memo||"":"", adjust: old?old.adjust||0:0});
  });
  if(prev){ prev.teachers.filter(t=>t.role!=="담임" && t.role!=="전담").forEach(t=>teachers.push(t)); }
  return {
    version:2,
    semester: prev?prev.semester:2,
    teachers,
    lessons: imp.lessons,
    classNotes: imp.classNotes||{},
    importWarns: imp.warns||[],
    importedAt: new Date().toISOString().slice(0,16).replace("T"," "),
    history: prev?prev.history:[],
    settings: prev?prev.settings:deepClone(DEFAULT_SETTINGS),
    tt: prev?prev.tt:deepClone(DEFAULT_TT)
  };
}

const DOC_REF = () => window.doc(window.db, "app_data", "hyeonggok_v1");

function save(){
  state._act = null;
  const c = Object.assign({}, state);
  delete c._act;
  
  if (window.db && window.setDoc) {
    window.setDoc(DOC_REF(), c).catch(err => {

      alert("서버 저장 실패: 인터넷 연결 및 Firebase 설정을 확인하세요.");

  state = freshStateFromImport(PRELOAD, null);

  ensureWeightItems();
}

function initRealtimeSync() {
  if (!window.db || !window.onSnapshot) {
    setTimeout(initRealtimeSync, 100);
    return;
  }
  window.onSnapshot(DOC_REF(), (docSnap) => {
    if (docSnap.exists()) {
      state = docSnap.data();
      state._act = null;
      ensureWeightItems();
      render();
    } else {
      // DB에 초기 데이터가 없으면 내장 기본값으로 저장
      loadLocalDefault();
      save();
    }
  });
}

function afterImport(){
  const inp=document.getElementById("xlsxFile");
  if(!inp) return;
  inp.addEventListener("change", e=>{
    const f=e.target.files[0]; if(!f) return;
    if(typeof XLSX==="undefined"){ document.getElementById("xlsxStatus").textContent="엑셀 해석 라이브러리를 불러올 수 없습니다(오프라인). 아래 복사-붙여넣기를 이용하세요."; return; }
    const rd=new FileReader();
    rd.onload=ev=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        const sheets=wb.SheetNames.map(n=>({name:n, rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1, defval:"", raw:false})}));
        const det=detectSheets(sheets);
        if(!det.jd){ alert("전담 시간표 시트를 찾지 못했습니다."); return; }
        pendingImport = buildImport(det.jd.rows, det.cl?det.cl.rows:null);
        pendingImport.sourceName=f.name+" (전담: "+det.jd.name+(det.cl?", 담임: "+det.cl.name:"")+")";
        showPreview();
      }catch(err){ alert("파일을 읽는 중 오류: "+err.message); }
    };
    rd.readAsArrayBuffer(f);
  });
}

let edTeacher=null;
function parseSubj(label){ const r=[],re=/([가-힣A-Za-z]+)\s*\(([^)]*)\)/g; let m; while((m=re.exec(label||""))!==null) r.push({subject:m[1],grades:parseGradeList(m[2])}); return r; }
function subjFor(t,g){ const s=parseSubj(t.label); const f=s.find(x=>x.grades.indexOf(g)>=0); return f?f.subject:(s[0]?s[0].subject:(t.label||"")); }
function edConflicts(){
  const m={},out=[]; const cs=new Set(state.teachers.filter(t=>t.role==="담임").map(t=>t.grade+"-"+t.cls));
  state.lessons.forEach(l=>{const k=l.grade+"-"+l.cls+"|"+l.day+"|"+l.period;(m[k]=m[k]||[]).push(l.teacher);});
  Object.keys(m).forEach(k=>{const ts=Array.from(new Set(m[k])); const a=k.split("|"); if(ts.length>1) out.push(a[0]+" "+DAYS[a[1]]+" "+a[2]+"교시에 "+ts.join(", ")+" 중복 배정");});
  const u=new Set(); state.lessons.forEach(l=>{const c=l.grade+"-"+l.cls; if(!cs.has(c)) u.add(c+" ("+l.teacher+")");}); u.forEach(x=>out.push("명단에 없는 학급: "+x));
  return out;
}
function confHtml(){ const c=edConflicts(); return c.length?`<div class="warnbox"><b>시간표 충돌·오류 ${c.length}건</b><ul>${c.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:`<div class="okbox">충돌 없음 — 같은 학급에 두 전담이 겹치지 않고, 모든 학급이 명단에 있습니다.</div>`; }

function setCell(id,d,p,v,el){
  const t=state.teachers.find(x=>x.id===id); const nl=[];
  for(const tok of v.split(/[\/,]/).map(s=>s.trim()).filter(Boolean)){

    nl.push({teacher:t.name,day:d,period:p,grade:+m[1],cls:+m[2],subject:subjFor(t,+m[1])});
  }
  state.lessons=state.lessons.filter(l=>!(l.teacher===t.name&&l.day===d&&l.period===p)).concat(nl);
  state.importWarns=[]; save();
  if(el) el.value=nl.map(l=>l.grade+"-"+l.cls).join("/");
  const c=document.getElementById("edConf"); if(c) c.innerHTML=confHtml();
}
function setLabel(id,v){ const t=state.teachers.find(x=>x.id===id); t.label=v.trim(); state.lessons.forEach(l=>{ if(l.teacher===t.name) l.subject=subjFor(t,l.grade); }); save(); render(); }

let A={absentId:"", date:todayStr(), periods:[], longTerm:false, reason:"", result:null, picks:{}, lunchPick:""};
function renderAssign(){
  const grp=(role)=>state.teachers.filter(t=>t.role===role).map(t=>`<option value="${t.id}" ${A.absentId===t.id?"selected":""}>${esc(dn(t))} — ${esc(roleLabel(t))}</option>`).join("");

        periodBoxes+=`<label class="chk"><input type="checkbox" value="${p}" ${A.periods.indexOf(p)>=0?"checked":""} onchange="togglePeriod(${p},this.checked)"> ${p}교시 <span class="tiny">${blockLabel(tt,bi)}${l?" · "+l.subject+" 전담":""}</span></label>`; }

      ps.forEach(p=>{ const ls=mine.filter(x=>x.period===p); const bi=periodToBlockIdx(tt,ls[0].grade,p);
        periodBoxes+=`<label class="chk"><input type="checkbox" value="${p}" ${A.periods.indexOf(p)>=0?"checked":""} onchange="togglePeriod(${p},this.checked)"> ${p}교시 <span class="tiny">${blockLabel(tt,bi)} · ${ls.map(x=>x.grade+"-"+x.cls).join("/")} ${ls[0].subject}</span></label>`; });
      if(ps.length) periodBoxes+=` <button class="sm" onclick="selAll(0,[${ps.join(",")}])">전체 선택</button>`;
    } else periodBoxes=`<span class="muted">비담임·관리자는 수업이 없어 보결이 필요하지 않습니다.</span>`;
  } else if(absent && day===null) periodBoxes=`<span class="warn">주말입니다. 날짜를 확인하세요.</span>`;

   <label>날짜 <input type="date" value="${A.date}" onchange="A.date=this.value;A.periods=[];A.result=null;render()"> <b>${day===null?"":DAYS[day]+"요일"}</b></label>

function togglePeriod(p,on){ if(on){ if(A.periods.indexOf(p)<0) A.periods.push(p);} else A.periods=A.periods.filter(x=>x!==p); A.periods.sort((a,b)=>a-b); A.result=null; document.querySelector("#main button.primary").disabled=!A.periods.length; }
function selAll(mp,list){ A.periods=list?list.slice():Array.from({length:mp},(_,i)=>i+1); A.result=null; render(); }
function afterAssign(){}
function compute(){
  const absent=state.teachers.find(t=>t.id===A.absentId); const day=dayOfDate(A.date); const tt=state.tt; const act=activeLessons(state);
  const tentative={}; const items=[]; A.picks={}; const usedSwap=[];
  const swaps = absent.role==="담임" ? swapSuggestions(state,absent,day,A.periods) : {};
  A.periods.forEach(p=>{
    let grade, cls, clsLabel, bi, note=null, homeroomFirst=false;
    if(absent.role==="담임"){
      grade=absent.grade; cls=absent.cls; clsLabel=grade+"-"+cls; bi=periodToBlockIdx(tt,grade,p);
      const l=act.find(x=>x.day===day&&x.period===p&&x.grade===grade&&x.cls===cls);
      if(l){ note="이 시간은 "+l.subject+" 전담("+l.teacher+") 수업 시간입니다. 담임 보결이 필요하지 않습니다."; items.push({p,bi,grade,cls,clsLabel,note,cands:[],swaps:[]}); return; }
    } else {
      const ls=act.filter(x=>x.teacher===absent.name&&x.day===day&&x.period===p);
      grade=ls[0].grade; cls=ls[0].cls; clsLabel=ls.map(x=>x.grade+"-"+x.cls).join("/"); bi=periodToBlockIdx(tt,grade,p); homeroomFirst=true;
      if(ls.length>1) note="합반 수업입니다. 각 학급 담임이 자기 학급을 맡는 방안도 검토하세요.";
    }
    const cands=rankCandidates(state,{absent,day,dateStr:A.date,period:p,grade,cls,bi,tentative,homeroomFirst});
    const sw=(swaps[p]||[]).filter(s=>usedSwap.indexOf(s.teacher.id+"@"+s.fromPeriod)<0);
    let pick = sw.length ? "swap:0" : (cands.length? cands[0].teacher.id : "");
    if(pick && !pick.startsWith("swap:")) tentative[pick]=(tentative[pick]||0)+1;
    if(pick==="swap:0") usedSwap.push(sw[0].teacher.id+"@"+sw[0].fromPeriod);
    A.picks[p]=pick;
    items.push({p,bi,grade,cls,clsLabel,note,cands,swaps:sw});
  });
  let lunch=null;
  if(state.settings.lunchSupervisor && absent.role==="담임"){
    const g=absent.grade; const lb=lunchBlockIdx(groupOf(tt,g)); const mp=maxPeriodOf(tt,g,day);
    const before=blockIdxToPeriod(tt,g,lb-1), after=blockIdxToPeriod(tt,g,lb+1);
    const touches = A.periods.indexOf(before)>=0 || (after && after<=mp && A.periods.indexOf(after)>=0);
    if(touches){
      const cands=rankCandidates(state,{absent,day,dateStr:A.date,period:5,grade:g,cls:absent.cls,bi:lb,tentative,homeroomFirst:false});
      lunch={bi:lb,cands}; A.lunchPick=cands.length?cands[0].teacher.id:"";
    }
  }
  A.result={absent,day,items,lunch,swaps}; render();
}
function renderResult(){
  const R=A.result, tt=state.tt, absent=R.absent;

    const top=it.cands.slice(0,3).map((c,i)=>`<label class="cand"><input type="radio" name="pick${it.p}" value="${c.teacher.id}" ${A.picks[it.p]===c.teacher.id?"checked":""} onchange="A.picks[${it.p}]=this.value"> <b>${i+1}순위</b> ${esc(dn(c.teacher))} <span class="tiny">${esc(roleLabel(c.teacher))} · ${c.status.code}${c.status.detail?"("+esc(c.status.detail)+")":""} · ${c.score}점</span><div class="tiny reasons">${c.reasons.map(esc).join(" · ")}</div></label>`).join("");
    const rest=it.cands.slice(3);

function confirmAssign(){
  const R=A.result, tt=state.tt, absent=R.absent; const added=[];
  R.items.forEach(it=>{
    if(!it.cands.length && !it.swaps.length) return;
    const pick=A.picks[it.p]; if(!pick) return;
    let subId, subName, type="보결";
    if(pick.startsWith("swap:")){ const s=it.swaps[Number(pick.split(":")[1])]; subId=s.teacher.id; subName=s.teacher.name; type="교체"; }
    else { const t=state.teachers.find(x=>x.id===pick); if(!t) return; subId=t.id; subName=dn(t); }
    const h={id:uid(), date:A.date, day:R.day, absentId:absent.id, absentName:dn(absent), cls:it.clsLabel, period:it.p, periodLabel:it.p+"교시", bi:it.bi, subId, subName, type, reason:A.reason, semester:state.semester};
    state.history.push(h); added.push(h);
  });
  if(R.lunch && A.lunchPick){ const t=state.teachers.find(x=>x.id===A.lunchPick); if(t){ const h={id:uid(), date:A.date, day:R.day, absentId:absent.id, absentName:dn(absent), cls:absent.grade+"-"+absent.cls, period:0, periodLabel:"점심", bi:R.lunch.bi, subId:t.id, subName:dn(t), type:"보결", reason:A.reason, semester:state.semester}; state.history.push(h); added.push(h);} }
  save();
  document.getElementById("notice").innerHTML = added.length? `<h3>안내문</h3><textarea id="noticeTxt" rows="14">${esc(makeNotice(absent, added))}</textarea><br><button onclick="copyNotice()">복사</button> <button onclick="A={absentId:'',date:todayStr(),periods:[],longTerm:false,reason:'',result:null,picks:{},lunchPick:''};render()">새 등록</button>` : `<div class="warn">확정된 항목이 없습니다.</div>`;
}
function makeNotice(absent, added){
  const tt=state.tt; const day=added[0].day;
  const L=[]; L.push("[보결 안내] "+fmtDate(A.date)+" "+dn(absent)+" 선생님("+roleLabel(absent)+") 결강"+(A.reason?" — "+A.reason:""));
  L.push("");
  added.slice().sort((a,b)=>a.bi-b.bi).forEach(h=>{
    const [g]=String(h.cls).split("-").map(Number);
    const mp=maxPeriodOf(tt,g,day); const lb=lunchBlockIdx(groupOf(tt,g));
    const tags=[];
    if(h.period===1) tags.push("아침활동·과제검사·출결 점검");
    if(h.period>0 && h.bi===lb-1) tags.push("급식지도 담당");
    if(h.period===mp) tags.push("하교·전달사항·청소지도");
    if(h.periodLabel==="점심") tags.push("급식지도, 보결대장 수기 서명");
    const t=state.teachers.find(x=>x.id===h.subId);
    L.push("- "+h.periodLabel+"("+blockLabel(tt,h.bi)+") "+h.cls+": "+h.subName+(t?"("+roleLabel(t)+")":"")+(h.type==="교체"?" ※전담 시간 교체":"")+(tags.length?" ※"+tags.join(", "):""));
  });
  L.push("");
  L.push("※ 결강교사가 보결교사 지정·결재 신청(긴급 시 학년부장). 보결수당은 시간당 "+state.settings.wagePerHour.toLocaleString()+"원, 학기별 지급.");
  return L.join("\n");
}

let pendingHist=null;
function normName(s){ return String(s||"").replace(/\(.*?\)/g,"").replace(/\s+/g,""); }
function parseHistRows(rows){
  const out={items:[],bad:[]}; const H=s=>String(s===undefined||s===null?"":s).replace(/\s+/g,"");
  let col=null, lastDate="";
  rows.forEach((r,ri)=>{
    const hs=r.map(H);
    if(hs.some(x=>/^(일자|날짜)/.test(x)) && hs.some(x=>/^(보강|보결)/.test(x))){
      col={}; lastDate="";
      hs.forEach((x,j)=>{ if(/^(일자|날짜)/.test(x)) col.date=j; else if(/^학년/.test(x)) col.cls=j; else if(/^교시/.test(x)) col.p=j; else if(/^교과/.test(x)) col.subj=j; else if(/^결강/.test(x)) col.abs=j; else if(/^사유/.test(x)) col.reason=j; else if(/^(보강|보결)/.test(x)&&col.sub===undefined) col.sub=j; });
      return;
    }
    if(!col) return;
    const g=k=>col[k]===undefined?"":String(r[col[k]]===undefined||r[col[k]]===null?"":r[col[k]]).trim();
    const dm=g("date").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if(dm) lastDate=dm[1]+"-"+dm[2].padStart(2,"0")+"-"+dm[3].padStart(2,"0");
    const cm=g("cls").match(/(\d)\s*(?:학년)?\s*[\/\-]\s*(\d+)/), pm=g("p").match(/\d/), ab=normName(g("abs")), sb=normName(g("sub"));
    if(!cm&&!pm&&!ab&&!sb) return;
    if(!lastDate||!cm||!pm||!ab||!sb){ out.bad.push((ri+1)+"행: 날짜·학급·교시·결강교사·보강교사 중 빈 칸이 있어 제외"); return; }
    out.items.push({date:lastDate,grade:+cm[1],cls:+cm[2],period:+pm[0],subject:g("subj"),absent:ab,sub:sb,reason:g("reason"),row:ri+1});
  });
  return out;
}
function findTeacherByName(n){ return state.teachers.find(x=>normName(x.name)===n); }
function histKey(h){ return [h.date,h.period,h.cls,h.subName,h.absentName].join("|"); }
function previewHist(parsedList){
  const items=[],bad=[]; parsedList.forEach(p=>{ items.push(...p.items); bad.push(...p.bad); });
  const exist=new Set(state.history.map(histKey)); const add=[],dup=[],unk=new Set();
  items.forEach(it=>{
    const day=dayOfDate(it.date); if(day===null){ bad.push(it.row+"행: "+it.date+" 은(는) 주말이라 제외"); return; }
    const a=findTeacherByName(it.absent), s=findTeacherByName(it.sub); if(!a) unk.add(it.absent); if(!s) unk.add(it.sub);
    const h={id:uid(),date:it.date,day,absentId:a?a.id:"ext:"+it.absent,absentName:a?dn(a):it.absent,cls:it.grade+"-"+it.cls,period:it.period,periodLabel:it.period+"교시",bi:periodToBlockIdx(state.tt,it.grade,it.period),subId:s?s.id:"ext:"+it.sub,subName:s?dn(s):it.sub,type:"보결",reason:it.reason,subject:it.subject,semester:it.date>=state.settings.semesterStart[2]?2:1,imported:true};
    if(exist.has(histKey(h))) dup.push(h); else { exist.add(histKey(h)); add.push(h); }
  });
  pendingHist={add,dup,unk:Array.from(unk),bad}; showHistPreview();
}
function showHistPreview(){
  const p=pendingHist, el=document.getElementById("histPreview"); if(!el) return;
  const by={}; p.add.forEach(h=>{ by[h.subName]=(by[h.subName]||0)+1; });
  const s1=p.add.filter(h=>h.semester===1).length, s2=p.add.length-s1;
  const cnt=state.semester===1?s1:s2;
  el.innerHTML=`<div class="card"><b>미리보기</b> — 새로 추가 <b>${p.add.length}건</b> (1학기 ${s1} · 2학기 ${s2}) · 이미 있는 이력 ${p.dup.length}건 건너뜀 · 제외된 줄 ${p.bad.length}건
   <div class="tiny" style="margin:6px 0">보강교사별: ${Object.keys(by).sort((a,b)=>by[b]-by[a]).map(k=>esc(k)+" "+by[k]+"회").join(", ")||"없음"}</div>
   ${p.unk.length?`<div class="warnbox tiny"><b>현재 명단에 없는 이름 ${p.unk.length}명</b>: ${p.unk.map(esc).join(", ")}<br>이름으로만 기록되고 누적 통계에는 잡히지 않습니다. 오타라면 엑셀을 고쳐서 다시 올리세요.</div>`:""}
   ${p.bad.length?`<ul class="tiny warnlist">${p.bad.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
   <div class="tiny muted">현재 ${state.semester}학기 누적에는 ${cnt}건이 반영됩니다. (이전 학기 이력은 이력 목록에만 남고 현재 학기 누적에는 포함되지 않습니다.)</div>
   <button class="primary" onclick="applyHist()" ${p.add.length?"":"disabled"}>이 이력 ${p.add.length}건 추가</button></div>`;
}
function applyHist(){ state.history.push(...pendingHist.add); const n=pendingHist.add.length; pendingHist=null; save(); alert(n+"건을 추가했습니다."); render(); }
function histFile(f){
  if(!f) return; if(typeof XLSX==="undefined"){ alert("엑셀 라이브러리를 불러올 수 없습니다(오프라인). 아래 복사-붙여넣기를 이용하세요."); return; }
  const rd=new FileReader();
  rd.onload=ev=>{ try{ const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
    previewHist(wb.SheetNames.map(n=>parseHistRows(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:"",raw:false})))); }catch(e){ alert("파일을 읽는 중 오류: "+e.message); } };
  rd.readAsArrayBuffer(f);
}
function histPaste(){ const t=document.getElementById("histPasteTxt").value; if(!t.trim()){ alert("내용을 붙여넣어 주세요."); return; } previewHist([parseHistRows(tsvRows(t))]); }
const HIST_CARD=`<div class="card"><h3>앱 도입 전 보결 이력 불러오기</h3>
 <p class="tiny muted">보결 대장 엑셀을 올리면 열 제목(일자·학년/반·교시·교과·결강교사·사유·보강교사)을 찾아 읽습니다. 날짜 칸이 병합되어 있어도 됩니다. 이미 들어 있는 이력과 같은 건은 건너뛰므로 여러 번 올려도 중복되지 않습니다.</p>
 <input type="file" accept=".xlsx,.xls" onchange="histFile(this.files[0])">
 <details><summary class="tiny">인터넷이 안 될 때: 복사-붙여넣기</summary><textarea id="histPasteTxt" rows="5" placeholder="머리글 줄부터 표를 복사해 붙여넣기"></textarea><br><button onclick="histPaste()">붙여넣은 내용 해석</button></details>
 <div id="histPreview"></div></div>`;

   ${state.settings.weightItems.map((x,i)=>`<tr><td><input style="width:260px" value="${esc(x.label)}" onchange="setWeightLabel(${i},this.value)"></td><td class="r"><input type="number" class="num" value="${x.value}" onchange="setWeightValue(${i},this.value)"></td><td><button class="danger sm" onclick="removeWeight(${i})">삭제</button></td></tr>`).join("")}
   </table>
   <div class="row"><select id="weightAddSel">${WEIGHT_DEFS.filter(d=>!state.settings.weightItems.some(x=>x.key===d.key)).map(d=>`<option value="${d.key}">${esc(d.label)}</option>`).join("")}</select><button onclick="addWeight()" ${state.settings.weightItems.length>=WEIGHT_DEFS.length?"disabled":""}>+ 항목 추가</button></div>
  </div>
  <div><h3>시정표</h3>
   <table class="small"><tr><th>블록</th><th>시작</th><th>종료</th><th>1·2·6학년</th><th>3·4·5학년</th></tr>
   ${tt.blocks.map((b,bi)=>`<tr><td>${b.id}</td><td><input class="tm" value="${b.start}" onchange="state.tt.blocks[${bi}].start=this.value;save()"></td><td><input class="tm" value="${b.end}" onchange="state.tt.blocks[${bi}].end=this.value;save()"></td><td>${(p=>p===null?"점심":p+"교시")(blockIdxToPeriod(tt,1,bi))}</td><td>${(p=>p===null?"점심":p+"교시")(blockIdxToPeriod(tt,3,bi))}</td></tr>`).join("")}</table>
   <label>점심이 12:20인 학년(그룹1) <input value="${tt.group1Grades.join(",")}" onchange="state.tt.group1Grades=this.value.split(',').map(Number).filter(Boolean);save();render()"></label>
   <h3>학년별 요일 교시 수</h3>
   <table class="small"><tr><th>학년</th>${DAYS.map(d=>`<th>${d}</th>`).join("")}</tr>
   ${[1,2,3,4,5,6].map(g=>`<tr><td>${g}</td>${DAYS.map((d,i)=>`<td><input type="number" class="num" value="${tt.maxPeriods[g][i]}" onchange="state.tt.maxPeriods[${g}][${i}]=Number(this.value);save()"></td>`).join("")}</tr>`).join("")}</table>
   <h3>백업</h3>
   <button onclick="backup()">전체 백업 내려받기(.json)</button> <label class="btn">백업 복원 <input type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"></label>
   <p class="tiny muted">데이터는 Firebase 데이터베이스에 자동 저장됩니다. PC 교체·학기 말 백업용으로 내려받아 두실 수 있습니다.</p>
   <button class="danger" onclick="resetAll()">초기화(내장 시간표로 되돌리기)</button>
  </div></div>`;
}
function setWeightValue(i,v){
  ensureWeightItems();
  const x=state.settings.weightItems[i]; if(!x) return;
  x.value=Number(v)||0; state.settings.w[x.key]=x.value; save();
}
function setWeightLabel(i,v){
  ensureWeightItems();
  const x=state.settings.weightItems[i]; if(!x) return;
  x.label=(v||"").trim()||WEIGHT_DEFS.find(d=>d.key===x.key).label; save(); render();
}
function addWeight(){
  ensureWeightItems();
  const sel=document.getElementById("weightAddSel"); const key=sel&&sel.value;
  const d=WEIGHT_DEFS.find(x=>x.key===key);
  if(!d) return;
  if(state.settings.weightItems.some(x=>x.key===key)) return;
  const value=Number(DEFAULT_SETTINGS.w[key]??0);
  state.settings.weightItems.push({key,label:d.label,value});
  state.settings.w[key]=value; save(); render();
}
function removeWeight(i){
  ensureWeightItems();
  const x=state.settings.weightItems[i]; if(!x) return;
  if(!confirm("\""+x.label+"\" 기준을 삭제할까요? 삭제하면 보결 추천 점수에 이 기준이 반영되지 않습니다.")) return;
  state.settings.weightItems.splice(i,1);
  delete state.settings.w[x.key];
  save(); render();
}

function backup(){ const c=Object.assign({},state); delete c._act; dl(new Blob([JSON.stringify(c,null,1)],{type:"application/json"}), "보결앱_백업_"+todayStr()+".json"); }
function restore(f){ if(!f) return; const rd=new FileReader(); rd.onload=e=>{ try{ const s=JSON.parse(e.target.result); if(!s.teachers||!s.lessons) throw new Error("형식 오류"); state=s; ensureWeightItems(); save(); alert("복원했습니다."); showTab("dash"); }catch(err){ alert("복원 실패: "+err.message); } }; rd.readAsText(f); }
function resetAll(){ if(!confirm("모든 이력·설정이 초기화되고 서버 데이터가 내장 시간표로 돌아갑니다. 계속할까요?")) return; loadLocalDefault(); save(); showTab("dash"); }

// ---- 앱 초기화 ----
window.addEventListener("DOMContentLoaded", ()=>{
  loadLocalDefault();
  initRealtimeSync();
  const nav=document.getElementById("nav");
  nav.innerHTML=TABS.map(([id,l])=>`<button class="tab ${id===cur?"on":""}" data-t="${id}" onclick="showTab('${id}')">${l}</button>`).join("");
  render();
});
</script>
</body></html>
